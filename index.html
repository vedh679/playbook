<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Playbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Escrow (headings) -> Playfair Display | Exchange (body) -> Source Serif 4 -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* Minimal Wall Street Journal palette — monochrome only */
      --bg: #ffffff;
      --paper: #f6f5f1;        /* warm newsprint tint */
      --surface: #ffffff;
      --text: #111111;          /* near-black ink */
      --body: #2b2b2b;          /* body ink */
      --muted: #6b6b6b;         /* secondary gray */
      --border: #e3e1db;        /* hairline rules */
      --border-strong: #cfccc4;
      --rule: #111111;          /* heavy black rule */
      --ink-soft: rgba(17, 17, 17, 0.06);
      --shadow: 0 1px 2px rgba(17,17,17,.04), 0 14px 40px rgba(17,17,17,.06);
      --font-head: "Playfair Display", "Escrow", Georgia, "Times New Roman", serif;
      --font-body: "Source Serif 4", "Exchange", Georgia, "Times New Roman", serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--body);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Faint monochrome background glow — drifting grayscale, no colour */
    .glow { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
    .orb { position: absolute; border-radius: 50%; filter: blur(90px); }
    .orb.a { width: 580px; height: 580px; left: -140px; top: -180px;
      background: radial-gradient(circle, rgba(17,17,17,.05), transparent 70%);
      animation: float1 24s ease-in-out infinite alternate; }
    .orb.b { width: 520px; height: 520px; right: -150px; top: -60px;
      background: radial-gradient(circle, rgba(17,17,17,.04), transparent 70%);
      animation: float2 28s ease-in-out infinite alternate; }
    .orb.c { width: 640px; height: 640px; left: 32%; bottom: -300px;
      background: radial-gradient(circle, rgba(17,17,17,.035), transparent 70%);
      animation: float3 32s ease-in-out infinite alternate; }
    @keyframes float1 { to { transform: translate(80px, 60px) scale(1.1); } }
    @keyframes float2 { to { transform: translate(-70px, 50px) scale(1.08); } }
    @keyframes float3 { to { transform: translate(60px, -50px) scale(1.12); } }

    /* App shell */
    .app { position: relative; z-index: 1; height: 100dvh; display: flex; flex-direction: column; }

    /* Masthead — black top rule, hairline beneath */
    .topbar {
      position: relative;
      display: flex; align-items: center; justify-content: flex-end;
      padding: 0 22px; height: 62px; flex: 0 0 auto;
      background: rgba(255,255,255,.82); backdrop-filter: blur(8px);
      box-shadow: inset 0 3px 0 var(--rule);
    }
    .brand {
      position: absolute; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; font-family: var(--font-head); font-weight: 700; font-size: 21px; color: var(--text);
    }
    .newchat {
      display: inline-flex; align-items: center; gap: 7px; cursor: pointer;
      font-family: var(--font-body); font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
      color: var(--text); background: transparent; border: 1px solid var(--rule); border-radius: 999px;
      padding: 8px 15px; transition: background .2s, color .2s;
    }
    .newchat:hover { background: var(--paper); }

    /* Scrollable stage */
    .stage { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; scroll-behavior: smooth; }
    .stage-inner { width: 100%; max-width: 740px; margin: 0 auto; padding: 12px 22px; flex: 1; display: flex; flex-direction: column; }

    /* Welcome (empty) state */
    .welcome { margin: auto 0; text-align: center; padding: 24px 0 12px; }
    .welcome .kicker { display: inline-flex; align-items: center; gap: 9px; font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 22px; }
    .welcome .kicker .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); box-shadow: 0 0 0 0 rgba(17,17,17,.28); animation: pulse 2.6s infinite; }
    @keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(17,17,17,0); } 100% { box-shadow: 0 0 0 0 rgba(17,17,17,0); } }
    .welcome h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(36px, 6.4vw, 60px); line-height: 1.04; letter-spacing: -.01em; color: var(--text); }
    .welcome h1 .em { font-style: italic; font-weight: 500; }
    .welcome p { margin: 18px auto 0; max-width: 500px; color: var(--muted); font-size: 17.5px; line-height: 1.55; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 9px; margin-top: 28px; }
    .chip { font-family: var(--font-body); font-size: 14px; color: var(--body); background: rgba(255,255,255,.7); border: 1px solid var(--border); border-radius: 999px; padding: 9px 16px; cursor: pointer; transition: border-color .2s, background .2s, transform .15s; backdrop-filter: blur(6px); }
    .chip:hover { border-color: var(--rule); background: #fff; transform: translateY(-1px); }

    body.chatting .welcome { display: none; }
    .welcome #center-mount { margin-top: 36px; }

    /* Thread */
    .thread { display: flex; flex-direction: column; gap: 28px; padding: 22px 0 26px; }
    .msg { animation: rise .45s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .msg.user { display: flex; justify-content: flex-end; }
    .msg.user .bubble {
      max-width: 82%; background: var(--rule); color: #fff;
      font-size: 16px; line-height: 1.5; padding: 12px 18px; border-radius: 18px 18px 5px 18px;
      white-space: pre-wrap;
    }

    .msg.assistant .who { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
    .msg.assistant .who .spark {
      width: 24px; height: 24px; border-radius: 6px; display: inline-grid; place-items: center;
      background: var(--rule); color: #fff; font-size: 13px;
    }
    .msg.assistant .who .name { font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .14em; text-transform: uppercase; }
    .msg.assistant .a { font-family: var(--font-body); color: var(--body); font-size: 17.5px; line-height: 1.64; padding-left: 34px; }
    .a p { margin: 0 0 13px; }
    .a p:last-child { margin-bottom: 0; }
    .a ul { margin: 0 0 13px; padding: 0; list-style: none; display: grid; gap: 9px; }
    .a li { position: relative; padding-left: 21px; }
    .a li::before { content: ""; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; background: var(--rule); }
    .a strong { color: var(--text); font-weight: 600; }
    .a em { font-style: italic; }
    .a code { font-family: ui-monospace, Menlo, monospace; font-size: .9em; background: var(--ink-soft); padding: 1px 5px; border-radius: 4px; }

    .status { display: inline-flex; align-items: center; gap: 9px; color: var(--muted); font-style: italic; font-size: 16px; }
    .status .spin { width: 13px; height: 13px; border: 2px solid var(--border-strong); border-top-color: var(--rule); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .caret { display: inline-block; width: 7px; height: 1.05em; background: var(--rule); margin-left: 2px; vertical-align: -2px; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .sources { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px; }
    .sources .label { width: 100%; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 2px; }
    .sources a {
      font-size: 13px; color: var(--text); text-decoration: none; background: var(--paper);
      border: 1px solid var(--border); border-radius: 999px; padding: 5px 13px;
      max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: border-color .2s;
    }
    .sources a:hover { border-color: var(--rule); }
    .err { color: var(--body); font-style: italic; font-size: 16px; border-left: 2px solid var(--rule); padding-left: 12px; }

    /* Composer dock */
    .dock { flex: 0 0 auto; padding: 8px 22px 16px; }
    body:not(.chatting) .dock { display: none; }
    .composer-block { max-width: 720px; width: 100%; margin: 0 auto; }
    .composer {
      display: flex; flex-direction: column; gap: 8px;
      background: var(--surface); border: 1px solid var(--border-strong); border-radius: 22px;
      padding: 16px 16px 12px; box-shadow: var(--shadow);
      transition: box-shadow .25s, border-color .25s;
    }
    .composer:focus-within { border-color: var(--rule); box-shadow: 0 0 0 3px var(--ink-soft), 0 16px 44px rgba(17,17,17,.10); }
    .composer textarea {
      width: 100%; border: none; outline: none; resize: none; background: transparent;
      font-family: var(--font-body); font-size: 16.5px; color: var(--text); line-height: 1.55;
      padding: 2px 4px; min-height: 26px; max-height: 184px;
    }
    .composer textarea::placeholder { color: #9d9c97; }
    .composer-bar { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
    .composer-mode { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .13em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .composer-mode .spark { width: 19px; height: 19px; border-radius: 5px; display: inline-grid; place-items: center; background: var(--rule); color: #fff; font-size: 11px; }
    .send {
      flex: 0 0 auto; width: 38px; height: 38px; border: none; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; color: #fff; background: var(--rule);
      transition: transform .15s, opacity .2s, background .2s;
    }
    .send:hover { transform: translateY(-1px); background: #2c2c2c; }
    .send:disabled { opacity: .35; cursor: default; transform: none; }
    .send svg { width: 18px; height: 18px; }
    .disclaimer { text-align: center; color: #a6a59f; font-size: 12.5px; margin-top: 10px; font-style: italic; }

    [hidden] { display: none !important; }

    .stage::-webkit-scrollbar { width: 10px; }
    .stage::-webkit-scrollbar-thumb { background: #e2e0da; border-radius: 999px; border: 3px solid var(--bg); }
    .stage::-webkit-scrollbar-thumb:hover { background: #cfccc4; }
  </style>
</head>
<body>
  <div class="glow"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

  <div class="app">
    <div class="topbar">
      <div class="brand">The Playbook</div>
      <button class="newchat" id="newchat" type="button">＋ New chat</button>
    </div>

    <div class="stage" id="stage">
      <div class="stage-inner">
        <div class="welcome" id="welcome">
          <h1>What's your <span class="em">next move?</span></h1>
          <div id="center-mount">
            <div class="composer-block" id="composer-block">
              <form class="composer" id="composer" autocomplete="off">
                <textarea id="input" rows="1" placeholder="How can I help with your next move?"></textarea>
                <div class="composer-bar">
                  <span class="composer-mode"><span class="spark">✦</span> Strategy advisor</span>
                  <button class="send" id="send" type="submit" aria-label="Send">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
                  </button>
                </div>
              </form>
              <div class="disclaimer">The Playbook is AI-generated guidance and can make mistakes — verify anything important.</div>
            </div>
          </div>
          <div class="chips" id="chips"></div>
        </div>
        <div class="thread" id="thread"></div>
      </div>
    </div>

    <div class="dock"><div id="bottom-mount"></div></div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const stage = $("stage"), thread = $("thread"), input = $("input"), send = $("send");
    const escapeHtml = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function formatAnswer(text) {
      const lines = escapeHtml(text).split("\n");
      let html = "", inList = false;
      const inline = (s) => s
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
        .replace(/\*(.+?)\*/g, "<em>$1</em>")
        .replace(/`(.+?)`/g, "<code>$1</code>");
      for (const raw of lines) {
        const line = raw.trim();
        if (/^[-*•]\s+/.test(line)) {
          if (!inList) { html += "<ul>"; inList = true; }
          html += "<li>" + inline(line.replace(/^[-*•]\s+/, "")) + "</li>";
        } else {
          if (inList) { html += "</ul>"; inList = false; }
          if (line) html += "<p>" + inline(line) + "</p>";
        }
      }
      if (inList) html += "</ul>";
      return html;
    }

    const composerBlock = $("composer-block"), centerMount = $("center-mount"), bottomMount = $("bottom-mount");
    const placeComposer = (toBottom) => (toBottom ? bottomMount : centerMount).appendChild(composerBlock);

    const history = [];
    let busy = false;
    const stick = () => { stage.scrollTop = stage.scrollHeight; };
    const autosize = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 184) + "px"; };

    async function ask(question) {
      question = question.trim();
      if (!question || busy) return;
      busy = true; send.disabled = true;
      if (!document.body.classList.contains("chatting")) {
        document.body.classList.add("chatting");
        placeComposer(true);
      }
      input.value = ""; autosize();

      const u = document.createElement("div");
      u.className = "msg user";
      u.innerHTML = '<div class="bubble"></div>';
      u.querySelector(".bubble").textContent = question;
      thread.appendChild(u);

      const m = document.createElement("div");
      m.className = "msg assistant";
      m.innerHTML = '<div class="who"><span class="spark">✦</span><span class="name">The Playbook</span></div>' +
        '<div class="a"><div class="status"><span class="spin"></span><span class="status-text">Thinking…</span></div></div>';
      thread.appendChild(m);
      stick();

      const a = m.querySelector(".a");
      const statusEl = a.querySelector(".status");
      let answer = "";
      const render = (streaming) => {
        a.innerHTML = formatAnswer(answer) + (streaming ? '<span class="caret"></span>' : "");
        stick();
      };

      try {
        const res = await fetch("/api/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, history }),
        });
        if (!res.ok || !res.body) throw new Error("The assistant is unavailable right now.");

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = "", sources = null;
        const handle = (evt) => {
          if (evt.type === "status") { const t = statusEl?.querySelector(".status-text"); if (t) t.textContent = evt.text; }
          else if (evt.type === "text") { answer += evt.text; render(true); }
          else if (evt.type === "sources") { sources = evt.sources; }
          else if (evt.type === "error") { a.innerHTML = '<div class="err">' + escapeHtml(evt.message) + "</div>"; stick(); }
        };

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n");
          buf = parts.pop();
          for (const part of parts) {
            const line = part.split("\n").find((l) => l.startsWith("data: "));
            if (line) { try { handle(JSON.parse(line.slice(6))); } catch {} }
          }
        }

        if (answer) {
          render(false);
          history.push({ role: "user", content: question });
          history.push({ role: "assistant", content: answer });
          if (sources && sources.length) {
            const box = document.createElement("div");
            box.className = "sources";
            box.innerHTML = '<div class="label">Sources</div>' +
              sources.map((s) => `<a href="${escapeHtml(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.title)}</a>`).join("");
            a.appendChild(box); stick();
          }
        } else if (!a.querySelector(".err")) {
          a.innerHTML = '<div class="err">No answer was returned. Please try again.</div>';
        }
      } catch (err) {
        a.innerHTML = '<div class="err">' + escapeHtml(err.message || "Something went wrong.") + "</div>";
      } finally {
        busy = false; send.disabled = false; input.focus();
      }
    }

    function newChat() {
      thread.innerHTML = ""; history.length = 0;
      document.body.classList.remove("chatting");
      placeComposer(false);
      input.value = ""; autosize(); input.focus();
    }

    async function init() {
      try {
        const data = await fetch("content.json").then((r) => r.json());
        if (data?.meta?.title) document.title = data.meta.title;
      } catch {}

      const suggestions = [
        "Where should I look for untapped business streams?",
        "How do I build a moat competitors can't copy?",
        "What's a strong go-to-market beachhead strategy?",
        "How do I know if my strategy is actually working?",
      ];
      $("chips").innerHTML = suggestions.map((q) => `<button class="chip" type="button">${q}</button>`).join("");
      $("chips").querySelectorAll(".chip").forEach((c) => c.addEventListener("click", () => ask(c.textContent)));

      input.addEventListener("input", autosize);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(input.value); } });
      $("composer").addEventListener("submit", (e) => { e.preventDefault(); ask(input.value); });
      $("newchat").addEventListener("click", newChat);
      input.focus();
    }

    init();
  </script>
</body>
</html>
